services:
  elysia-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elysia-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - elysia-data:/app/data
    networks:
      - elysia-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  elysia-data:
    driver: local

networks:
  elysia-network:
    driver: bridge
