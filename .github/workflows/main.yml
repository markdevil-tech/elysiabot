name: Keep Hugging Face Space Alive

on:
  schedule:
    # Menjalankan script setiap 15 menit
    - cron: '*/15 * * * *'
  # Memungkinkan Anda menjalankan workflow ini secara manual
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space
        run: |
          # Melakukan ping ke URL Space Anda
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://markdevilyt-elyyiabot.hf.space)
          echo "Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 405 ]; then
            echo "Ping berhasil! Space tetap bangun."
          else
            echo "Ping merespons dengan status: $HTTP_STATUS"
          fi
